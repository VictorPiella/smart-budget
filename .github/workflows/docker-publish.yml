name: Build & Push to Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://t:t@localhost:55432/t
        run: pytest -q tests

  build-and-push:
    name: Build image and push to Docker Hub
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Hub login ────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── Buildx for multi-platform / cache support ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Combined app image (nginx + uvicorn in one container) ───────────────
      - name: Build and push combined app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/smart-budget:latest
            ${{ secrets.DOCKER_USER }}/smart-budget:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy-pages:
    name: Deploy landing to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        env:
          # CI=false prevents CRA from treating ESLint warnings as errors (exit code 1)
          CI: "false"
          # Must match the GitHub Pages path: https://victorpiella.github.io/<repo-name>
          PUBLIC_URL: "/smart-budget"
          # Tells the landing page to hide login/register links (no backend on GH Pages)
          REACT_APP_GH_PAGES: "true"
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep the server's compose file in sync with the repo (ports, volumes, env)
      - name: Upload docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          # SHA256 host key fingerprint — protects the deploy key against MITM.
          # Get it with: ssh-keyscan -t ed25519 <host> | ssh-keygen -lf -
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          source: docker-compose.prod.yml
          target: ~/smartbudget

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT }}
          script: |
            cd ~/smartbudget
            mkdir -p backups letsencrypt certbot-www
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
