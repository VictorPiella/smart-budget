# HTTP-only config for the combined prod image.
# Used when DOMAIN is unset or no Let's Encrypt certificate is mounted yet
# (docker-entrypoint.sh picks this or nginx.combined-tls.conf at startup).
server {
    listen 80 default_server;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot, see setup-https.sh)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/smartbudget-common.conf;
}
